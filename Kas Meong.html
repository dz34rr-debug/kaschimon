<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kas Meong</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout concept: satu kolom ramping seperti layar HP, kartu bulat lembut, tab bawah dengan tombol Catat di tengah, maskot kucing di kepala halaman dan di keadaan kosong. */
:root{
  --bg:#FFF3F6; --card:#FFFFFF; --ink:#4A3B47; --muted:#85707F; --line:#F4DEE6;
  --pink:#F59BB4; --pink-soft:#FFE3EB; --accent:#CF4A74; --on-accent:#FFFFFF; --accent-ink:#A12F57;
  --cat:#FFD7B5;
  --devi:#8E7CE8; --devi-soft:#EEEAFF; --devi-ink:#4A3DA8;
  --novi:#F29A63; --novi-soft:#FFEBDC; --novi-ink:#8A4513;
  --kas:#4FBF9F; --kas-soft:#DFF6EE; --kas-ink:#1F6B55;
  --plus:#2F8F6F; --minus:#B8415F;
  --f-display:'Fredoka','Nunito',ui-rounded,system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2A2029; --card:#382C37; --ink:#F6E9EF; --muted:#BBA5B3; --line:#4B3B49;
    --pink:#F7A9BF; --pink-soft:#4F3040; --accent:#F58AAA; --on-accent:#2A2029; --accent-ink:#FFC4D6;
    --cat:#FFC9A0;
    --devi:#B4A7FF; --devi-soft:#3B3566; --devi-ink:#DDD6FF;
    --novi:#FFB88A; --novi-soft:#5A3E2D; --novi-ink:#FFD9BF;
    --kas:#6ED6B6; --kas-soft:#234840; --kas-ink:#B8F0DE;
    --plus:#7BE0C0; --minus:#FF9DB5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2A2029; --card:#382C37; --ink:#F6E9EF; --muted:#BBA5B3; --line:#4B3B49;
  --pink:#F7A9BF; --pink-soft:#4F3040; --accent:#F58AAA; --on-accent:#2A2029; --accent-ink:#FFC4D6;
  --cat:#FFC9A0;
  --devi:#B4A7FF; --devi-soft:#3B3566; --devi-ink:#DDD6FF;
  --novi:#FFB88A; --novi-soft:#5A3E2D; --novi-ink:#FFD9BF;
  --kas:#6ED6B6; --kas-soft:#234840; --kas-ink:#B8F0DE;
  --plus:#7BE0C0; --minus:#FF9DB5;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px 0;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-bottom:112px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
h2{font-size:19px}
h3{font-size:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.cap{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:var(--muted)}

/* header */
.top{display:flex;align-items:center;gap:12px;padding:6px 0 2px}
.top .ttl{flex:1;min-width:0}
.top h1{font-size:25px;line-height:1.1}
.top .sub{font-size:13px;color:var(--muted)}
.me{display:flex;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.me button{border:0;background:transparent;border-radius:999px;padding:6px 11px;font-weight:800;font-size:13px;color:var(--muted)}
.me button[aria-pressed="true"][data-w="Devi"]{background:var(--devi-soft);color:var(--devi-ink)}
.me button[aria-pressed="true"][data-w="Novita"]{background:var(--novi-soft);color:var(--novi-ink)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--kas-soft);color:var(--kas-ink)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.warn{background:var(--novi-soft);color:var(--novi-ink)}
.statusrow{display:flex;justify-content:flex-end;padding:4px 2px 0}

/* cards */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:16px;margin-top:14px;min-width:0}
.card h2+.sub,.card .sub{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.hero{position:relative;background:var(--pink-soft);border:1.5px solid var(--line);border-radius:28px;padding:20px 18px 18px;margin-top:22px}
.hero::before,.hero::after{content:"";position:absolute;top:-15px;width:36px;height:30px;background:var(--pink-soft);clip-path:polygon(0 100%,50% 0,100% 100%)}
.hero::before{left:30px;transform:rotate(-8deg)}
.hero::after{right:30px;transform:rotate(8deg)}
.hero .big{font-family:var(--f-display);font-weight:600;font-size:clamp(30px,10vw,40px);line-height:1.1;margin-top:2px;word-break:break-word}
.hero .mascot{position:absolute;right:14px;bottom:12px;opacity:.95}
.hero .sub{font-size:13px;color:var(--ink);opacity:.8;margin-top:6px;max-width:68%}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 10px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-weight:600;font-size:15px;margin-top:2px;word-break:break-word}
.stat small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px;line-height:1.3}

/* chips & inputs */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;min-height:40px}
.chip.sm{padding:5px 12px;min-height:32px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--pink-soft);border-color:var(--accent);color:var(--accent-ink)}
.chip[data-w="Devi"][aria-pressed="true"]{background:var(--devi-soft);border-color:var(--devi);color:var(--devi-ink)}
.chip[data-w="Novita"][aria-pressed="true"]{background:var(--novi-soft);border-color:var(--novi);color:var(--novi-ink)}
.chip[data-w="kas"][aria-pressed="true"]{background:var(--kas-soft);border-color:var(--kas);color:var(--kas-ink)}
.chip[data-w="bersama"][aria-pressed="true"]{background:var(--kas-soft);border-color:var(--kas);color:var(--kas-ink)}
.lbl{display:block;font-weight:800;font-size:13px;margin:14px 0 6px;color:var(--muted)}
.lbl:first-child{margin-top:0}
.inp{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:16px;padding:12px 14px;font-size:16px;min-height:48px}
textarea.inp{resize:vertical;min-height:96px}
.amt{font-family:var(--f-display);font-weight:600;font-size:26px}
.btn{border:0;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:13px 20px;font-weight:800;font-size:16px;min-height:50px;width:100%}
.btn.soft{background:var(--pink-soft);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.half{width:auto;flex:1}
.btn[disabled]{opacity:.55;cursor:default}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.typebar{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.typebar::-webkit-scrollbar{display:none}
.typebar .chip{white-space:nowrap}

/* transactions */
.tx{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1.5px dashed var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;min-width:0}
.tx:first-child{border-top:0}
.ico{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:var(--pink-soft)}
.ico.iuran{background:var(--kas-soft)} .ico.pinjam,.ico.bayar{background:var(--devi-soft)} .ico.pribadi{background:var(--novi-soft)}
.tx .mid{flex:1;min-width:0}
.tx .mid b{display:block;overflow-wrap:anywhere}
.tx .mid span{display:block;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.tx .amt2{font-family:var(--f-display);font-weight:600;white-space:nowrap}
.plus{color:var(--plus)} .minus{color:var(--minus)}
.detail{padding:0 0 12px 52px;font-size:13.5px}
.detail ul{margin:6px 0;padding:0;list-style:none}
.detail li{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.dayh{margin:16px 2px 0;font-weight:800;color:var(--muted);font-size:13px}
.del{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px;color:var(--minus)}
.del.sure{background:var(--minus);color:var(--card);border-color:var(--minus)}

/* month nav */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.mnav strong{font-family:var(--f-display);font-weight:600;font-size:19px}
.mnav button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:20px;font-weight:800}

/* bars */
.bar{display:grid;grid-template-columns:116px 1fr auto;gap:10px;align-items:center;margin-top:10px;font-size:13.5px}
.bar .t{height:12px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--pink);border-radius:99px}
.bar span:first-child{overflow-wrap:anywhere}

/* pairs */
.pair{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;margin-top:8px;background:var(--bg);font-weight:700}
.pair .who{font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;margin-right:6px}
.verdict{border-radius:20px;padding:14px;background:var(--kas-soft);color:var(--kas-ink);margin-top:10px}
.verdict b{font-family:var(--f-display);font-weight:600;font-size:18px;display:block}

/* struk */
.ritem{padding:12px 0;border-top:1.5px dashed var(--line)}
.ritem:first-of-type{border-top:0;padding-top:0}
.rline{display:grid;grid-template-columns:minmax(0,1fr) 112px 36px;gap:8px;align-items:center}
.rline .inp{min-height:44px;padding:9px 12px}
.who3{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.x{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:18px;line-height:1;color:var(--muted)}
.tot{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin-top:12px;font-weight:700}
.tot .g{border-top:1.5px dashed var(--line);padding-top:6px;margin-top:2px;font-family:var(--f-display);font-weight:600}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.msg{margin-top:10px;font-size:13.5px;font-weight:700;color:var(--accent-ink)}
.empty{text-align:center;padding:26px 10px}
.empty h3{margin-top:8px}
.steps{text-align:left;margin:14px auto 0;padding:0;list-style:none;display:grid;gap:8px;max-width:340px}
.steps li{background:var(--bg);border-radius:14px;padding:10px 12px;font-size:14px}
.steps b{color:var(--accent-ink)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1.5px solid var(--line);
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;align-items:end}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:11.5px;font-weight:800;color:var(--muted);min-height:48px}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent-ink)}
.nav .plusb{color:var(--on-accent)}
.nav .plusb span.c{width:52px;height:52px;border-radius:50%;background:var(--accent);display:grid;place-items:center;margin-top:-22px;border:4px solid var(--card)}
.nav .plusb svg{stroke:var(--on-accent);width:26px;height:26px}
.nav .plusb[aria-current="page"],.nav .plusb{color:var(--accent-ink)}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-weight:800;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:360px){.bar{grid-template-columns:92px 1fr auto}.rline{grid-template-columns:minmax(0,1fr) 96px 34px}}
</style>

<div class="app">
  <header class="top">
    <div id="logo"></div>
    <div class="ttl"><h1>Kas Meong</h1><div class="sub">Catatan uang Devi &amp; Novita</div></div>
    <div class="me" id="me" role="group" aria-label="Siapa yang memakai HP ini"></div>
  </header>
  <div class="statusrow"><span class="pill" id="status">Menyambungkan</span></div>
  <main id="view"></main>
</div>
<nav class="nav" aria-label="Menu utama"><div class="nav-in" id="nav"></div></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var PEOPLE=['Devi','Novita'];
var CATS=[['Makan','🍜'],['Pakan kucing','🐟'],['Main','🎡'],['Listrik','💡'],['Air','💧'],['Bensin','⛽'],['Belanja','🛒'],['Lainnya','✨']];
var CATICON={}; CATS.forEach(function(c){CATICON[c[0]]=c[1]});
var MONTHS=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var DAYS=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
var LS='kasmeong.v1';

var nf=new Intl.NumberFormat('id-ID');
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rp(n){n=Math.round(n||0);return (n<0?'-':'')+'Rp '+nf.format(Math.abs(n))}
function pad(n){return String(n).padStart(2,'0')}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayS(){return dstr(new Date())}
function ymOf(s){return s.slice(0,7)}
function monthLabel(ym){var p=ym.split('-');return MONTHS[+p[1]-1]+' '+p[0]}
function shiftMonth(ym,k){var p=ym.split('-').map(Number),y=p[0],m=p[1]+k;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+'-'+pad(m)}
function monthEnd(ym){var p=ym.split('-').map(Number);return dstr(new Date(p[0],p[1],0))}
function dateLabel(s){var p=s.split('-').map(Number);var dt=new Date(p[0],p[1]-1,p[2]);return DAYS[dt.getDay()]+', '+p[2]+' '+MONTHS[p[1]-1].slice(0,3)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function other(n){return n==='Devi'?'Novita':'Devi'}
function nm(n){return n==='kas'?'Kas bersama':n}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* ---------- state ---------- */
var S={tab:'home',month:ymOf(todayS()),txs:[],settings:{iuranDevi:2000000,iuranNovita:2000000},
  me:(lsGet(LS+'.me')==='Novita'?'Novita':'Devi'),loaded:false,mode:'connecting',canWrite:true,
  open:null,confirmDel:null,confirmSettle:false};
var F,R;
function resetF(type){
  F={type:type||'bersama',amount:'',desc:'',cat:'Makan',date:todayS(),paidBy:'kas',owner:S.me,ppaid:'self',who:S.me,from:S.me,to:other(S.me)};
}
function resetR(){R={items:[{name:'',price:'',who:'bersama'}],store:'',paidBy:'kas',date:todayS(),text:'',busy:false,msg:''}}
resetF();resetR();

var store={db:null};
var sampleFn=null,photoOK=false;

function sortTx(){S.txs.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:((b.ts||0)-(a.ts||0))})}

/* ---------- accounting ---------- */
function ledger(txs,upTo){
  var pool=0,d={};
  function owe(x,y,a){var k=x+'>'+y;d[k]=(d[k]||0)+a}
  txs.forEach(function(t){
    if(upTo&&t.date>upTo)return;
    var a=+t.amount||0;
    if(t.type==='iuran'){pool+=a}
    else if(t.type==='bersama'){if(t.paidBy==='kas')pool-=a;else owe('kas',t.paidBy,a)}
    else if(t.type==='pribadi'){var o=t.who;if(t.paidBy==='kas'){pool-=a;owe(o,'kas',a)}else if(t.paidBy!==o)owe(o,t.paidBy,a)}
    else if(t.type==='pinjam'){if(t.who==='kas')pool-=a;if(t.to==='kas')pool+=a;owe(t.to,t.who,a)}
    else if(t.type==='bayar'){if(t.who==='kas')pool-=a;if(t.to==='kas')pool+=a;owe(t.who,t.to,-a)}
  });
  var E=['Devi','Novita','kas'],N={Devi:0,Novita:0,kas:0},pairs=[];
  for(var i=0;i<3;i++)for(var j=i+1;j<3;j++){
    var a=E[i],b=E[j],net=(d[a+'>'+b]||0)-(d[b+'>'+a]||0);
    if(Math.abs(net)>=1){
      var x=net>0?a:b,y=net>0?b:a,v=Math.round(Math.abs(net));
      pairs.push({from:x,to:y,amount:v});N[y]+=v;N[x]-=v;
    }
  }
  return {pool:pool,N:N,pairs:pairs,keep:pool+N.kas};
}
function monthStats(txs,ym){
  var s={masuk:{Devi:0,Novita:0},bersama:0,pribadi:{Devi:0,Novita:0},cats:{},n:0};
  txs.forEach(function(t){
    if(ymOf(t.date)!==ym)return;s.n++;var a=+t.amount||0;
    if(t.type==='iuran'&&s.masuk[t.who]!=null)s.masuk[t.who]+=a;
    else if(t.type==='bersama'){s.bersama+=a;var c=t.cat||'Lainnya';s.cats[c]=(s.cats[c]||0)+a}
    else if(t.type==='pribadi'&&s.pribadi[t.who]!=null)s.pribadi[t.who]+=a;
  });
  return s;
}
function pairText(p){
  if(p.from==='kas')return 'Kas ganti ke '+p.to;
  if(p.to==='kas')return p.from+' setor ke kas';
  return p.from+' bayar ke '+p.to;
}

/* ---------- storage ---------- */
function persistLocal(){lsSet(LS,JSON.stringify({txs:S.txs,settings:S.settings}))}
function loadLocal(){
  var raw=lsGet(LS);if(!raw)return;
  try{var o=JSON.parse(raw);if(Array.isArray(o.txs))S.txs=o.txs;if(o.settings)S.settings=Object.assign(S.settings,o.settings)}catch(e){}
}
function guardWrite(){if(S.canWrite===false){toast('Kamu hanya bisa melihat catatan ini');return false}return true}
async function addTx(tx){
  tx.id=tx.id||uid();
  if(store.db){var id=tx.id,rest=Object.assign({},tx);delete rest.id;await store.db.collection('tx').doc(id).set(rest)}
  else{S.txs.push(tx);sortTx();persistLocal()}
}
async function removeTx(id){
  if(store.db){await store.db.collection('tx').doc(id).delete()}
  else{S.txs=S.txs.filter(function(t){return t.id!==id});persistLocal()}
}
async function saveSettings(){
  if(store.db){await store.db.doc('settings/main').set(S.settings)}
  else persistLocal();
}

/* ---------- ui bits ---------- */
var toastT;
function toast(m){var el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show')},2600)}
function cat(size,mood){
  var eyes=mood==='happy'
   ?'<path d="M19 36q4-5 8 0M37 36q4-5 8 0" stroke="var(--ink)" stroke-width="2.6" fill="none" stroke-linecap="round"/>'
   :'<circle cx="23" cy="36" r="2.9" fill="var(--ink)"/><circle cx="41" cy="36" r="2.9" fill="var(--ink)"/>';
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 64 64" aria-hidden="true" focusable="false">'
   +'<path d="M9 30L11 6l18 12z" fill="var(--cat)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>'
   +'<path d="M55 30L53 6 35 18z" fill="var(--cat)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>'
   +'<path d="M14 17l-.6-5 6 3.5z M50 17l.6-5-6 3.5z" fill="var(--pink)"/>'
   +'<ellipse cx="32" cy="39" rx="23" ry="19" fill="var(--cat)" stroke="var(--ink)" stroke-width="2.5"/>'
   +eyes
   +'<path d="M29.5 41h5l-2.5 3z" fill="var(--accent)"/>'
   +'<path d="M32 44v2.5M32 46.5q-3 3-6 1M32 46.5q3 3 6 1" stroke="var(--ink)" stroke-width="2" fill="none" stroke-linecap="round"/>'
   +'<circle cx="15.5" cy="44" r="3.2" fill="var(--pink)" opacity=".6"/><circle cx="48.5" cy="44" r="3.2" fill="var(--pink)" opacity=".6"/>'
   +'<path d="M6 40l8 1M6 46l8-2M58 40l-8 1M58 46l-8-2" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>'
   +'</svg>';
}

 home:'<svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>',
 hist:'<svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>',

var TABS=[['home','Beranda'],['hist','Riwayat'],['add','Catat'],['struk','Struk'],['rekap','Rekap']];
function renderChrome(){
  $('#logo').innerHTML=cat(46,'happy');
  $('#me').innerHTML=PEOPLE.map(function(p){return '<button data-act="me" data-w="'+p+'" data-v="'+p+'" aria-pressed="'+(S.me===p)+'">'+p+'</button>'}).join('');
  $('#nav').innerHTML=TABS.map(function(t){
    var k=t[0];
    if(k==='add')return '<button class="plusb" data-act="tab" data-v="add" '+(S.tab==='add'?'aria-current="page"':'')+' aria-label="Catat baru"><span class="c">'+ICONS.add+'</span><span>Catat</span></button>';
    return '<button data-act="tab" data-v="'+k+'" '+(S.tab===k?'aria-current="page"':'')+'>'+ICONS[k]+'<span>'+t[1]+'</span></button>';
  }).join('');
  var st=$('#status'),txt='Menyambungkan',warn=false;
  if(S.canWrite===false){txt='Hanya lihat';warn=true}
  else if(S.mode==='live'){txt='Tersinkron berdua'}
  else if(S.mode==='local'){txt='Tersimpan di HP ini';warn=true}
  else if(S.mode==='slow'){txt='Belum tersambung';warn=true}
  st.textContent=txt;st.className='pill'+(warn?' warn':'');
}

/* ---------- views ---------- */
function txMeta(t){
  var paid=t.paidBy==='kas'?'kas bersama':'uang '+t.paidBy;
  if(t.type==='bersama')return 'Bersama · dibayar '+paid;
  if(t.type==='pribadi')return 'Punya '+t.who+' · dibayar '+paid;
  if(t.type==='iuran')return 'Iuran dari '+t.who;
  if(t.type==='pinjam')return nm(t.to)+' pinjam dari '+nm(t.who);
  if(t.type==='bayar')return nm(t.who)+' bayar ke '+nm(t.to);
  return '';
}
function txIcon(t){
  if(t.type==='bersama')return CATICON[t.cat]||'🐾';
  if(t.type==='pribadi')return '🎀';
  if(t.type==='iuran')return '🐟';
  if(t.type==='pinjam')return '🤝';
  return '✅';
}
function txRow(t){
  var sign=t.type==='iuran'?'plus':(t.type==='bersama'||t.type==='pribadi')?'minus':'';
  var pre=t.type==='iuran'?'+':(t.type==='bersama'||t.type==='pribadi')?'-':'';
  var open=S.open===t.id;
  var html='<button class="tx" data-act="txopen" data-id="'+esc(t.id)+'" aria-expanded="'+open+'">'
   +'<span class="ico '+t.type+'">'+txIcon(t)+'</span>'
   +'<span class="mid"><b>'+esc(t.desc||'Tanpa judul')+'</b><span>'+esc(txMeta(t))+'</span></span>'
   +'<span class="amt2 num '+sign+'">'+pre+rp(t.amount)+'</span></button>';
  if(open){
    html+='<div class="detail">';
    if(t.items&&t.items.length){html+='<ul>'+t.items.map(function(i){return '<li><span>'+esc(i.name||'Barang')+'</span><span class="num">'+rp(i.price)+'</span></li>'}).join('')+'</ul>'}
    html+='<div class="muted small">'+dateLabel(t.date)+(t.by?' · dicatat '+esc(t.by):'')+'</div>';
    var sure=S.confirmDel===t.id;
    html+='<div style="margin-top:10px"><button class="del'+(sure?' sure':'')+'" data-act="txdel" data-id="'+esc(t.id)+'">'+(sure?'Yakin hapus?':'Hapus catatan')+'</button></div></div>';
  }
  return html;
}
function loadingView(){return '<div class="card empty">'+cat(72,'normal')+'<h3>Meong lagi membuka catatan…</h3><div class="muted small">Sebentar ya</div></div>'}
function emptyCard(title,text){return '<div class="card empty">'+cat(76,'happy')+'<h3>'+title+'</h3><div class="muted small">'+text+'</div></div>'}

function viewHome(){
  if(!S.loaded)return loadingView();
  var L=ledger(S.txs),cm=ymOf(todayS()),ms=monthStats(S.txs,cm);
  var h='<section class="hero"><div class="cap">Uang kas sekarang</div><div class="big num">'+rp(L.pool)+'</div>';
  if(Math.round(L.keep)!==Math.round(L.pool))h+='<div class="sub">Setelah semua dibereskan: <b class="num">'+rp(L.keep)+'</b></div>';
  else h+='<div class="sub">Dipegang Novita, dipakai berdua.</div>';
  h+='<div class="mascot">'+cat(62,'happy')+'</div></section>';
  if(!S.txs.length){
    h+='<div class="card empty">'+cat(76,'happy')+'<h3>Mulai dari iuran pertama</h3><div class="muted small">Tiga langkah supaya hitungan akhir bulan tinggal lihat.</div>'
     +'<ul class="steps"><li><b>1.</b> Catat iuran Devi dan Novita bulan ini.</li><li><b>2.</b> Catat tiap jajan, belanja, dan tagihan. Struk belanja bisa dimasukkan sekaligus.</li><li><b>3.</b> Akhir bulan buka Rekap untuk lihat siapa bayar siapa.</li></ul>'
     +'<div class="btnrow" style="justify-content:center"><button class="btn half" data-act="tab" data-v="add">Catat iuran</button></div></div>';
    return h;
  }
  h+='<div class="grid3">'
   +'<div class="stat"><span class="cap">Iuran masuk</span><b class="num">'+rp(ms.masuk.Devi+ms.masuk.Novita)+'</b><small>Devi '+rp(ms.masuk.Devi)+'<br>Novita '+rp(ms.masuk.Novita)+'</small></div>'
   +'<div class="stat"><span class="cap">Bersama</span><b class="num">'+rp(ms.bersama)+'</b><small>belanja bulan ini</small></div>'
   +'<div class="stat"><span class="cap">Pribadi</span><b class="num">'+rp(ms.pribadi.Devi+ms.pribadi.Novita)+'</b><small>Devi '+rp(ms.pribadi.Devi)+'<br>Novita '+rp(ms.pribadi.Novita)+'</small></div></div>';
  h+='<div class="card"><div class="row between"><h2>Perlu dibereskan</h2></div>';
  if(L.pairs.length){
    h+=L.pairs.map(function(p){return '<div class="pair"><span>'+esc(pairText(p))+'</span><span class="num">'+rp(p.amount)+'</span></div>'}).join('');
    h+='<div class="btnrow"><button class="btn soft" data-act="tab" data-v="rekap">Buka hitungan akhir bulan</button></div>';
  }else{
    h+='<div class="row" style="margin-top:8px">'+cat(44,'happy')+'<div><b>Semua impas</b><div class="muted small">Tidak ada utang antara Devi, Novita, dan kas.</div></div></div>';
  }
  h+='</div>';
  var recent=S.txs.slice(0,5);
  h+='<div class="card"><div class="row between"><h2>Terakhir dicatat</h2><button class="del" style="color:var(--accent-ink)" data-act="tab" data-v="hist">Semua</button></div>'+recent.map(txRow).join('')+'</div>';
  return h;
}
function monthNav(){
  return '<div class="mnav"><button data-act="month" data-v="-1" aria-label="Bulan sebelumnya">‹</button><strong>'+monthLabel(S.month)+'</strong><button data-act="month" data-v="1" aria-label="Bulan berikutnya">›</button></div>';
}
function viewHist(){
  if(!S.loaded)return loadingView();
  var list=S.txs.filter(function(t){return ymOf(t.date)===S.month});
  var h='<h2 style="margin-top:14px">Riwayat</h2>'+monthNav();
  if(!list.length)return h+emptyCard('Belum ada catatan di bulan ini','Yang kamu catat akan muncul di sini.');
  var last='',open=false;
  h+='<div class="card" style="padding-top:6px">';
  list.forEach(function(t){
    if(t.date!==last){h+='<div class="dayh">'+dateLabel(t.date)+'</div>';last=t.date}
    h+=txRow(t);
  });
  return h+'</div>';
}
function chipSet(key,opts,cur){
  return '<div class="chips">'+opts.map(function(o){return '<button class="chip" data-w="'+esc(o[0])+'" data-act="fset" data-k="'+key+'" data-v="'+esc(o[0])+'" aria-pressed="'+(cur===o[0])+'">'+esc(o[1])+'</button>'}).join('')+'</div>';
}
var PEOPLE_OPTS=[['Devi','Devi'],['Novita','Novita']];
var ALL_OPTS=[['Devi','Devi'],['Novita','Novita'],['kas','Kas']];
function viewAdd(){
  var f=F,h='<h2 style="margin-top:14px">Catat baru</h2>';
  var types=[['bersama','Bersama'],['pribadi','Pribadi'],['iuran','Iuran'],['pinjam','Pinjam'],['bayar','Bayar utang']];
  h+='<div class="typebar" style="margin-top:10px">'+types.map(function(t){return '<button class="chip" data-act="ftype" data-v="'+t[0]+'" aria-pressed="'+(f.type===t[0])+'">'+t[1]+'</button>'}).join('')+'</div>';
  var hint={bersama:'Makan, main, tagihan, atau kebutuhan yang dipakai berdua.',pribadi:'Barang milik satu orang. Tidak ikut menghabiskan uang bersama.',iuran:'Uang yang masuk ke kas bersama.',pinjam:'Salah satu meminjam uang ke yang lain atau ke kas.',bayar:'Mengembalikan pinjaman atau melunasi hitungan.'}[f.type];
  h+='<div class="card"><div class="muted small" style="margin-bottom:12px">'+hint+'</div>';
  h+='<label class="lbl" for="f-amount">Nominal</label><input class="inp amt num" id="f-amount" inputmode="numeric" placeholder="0" data-money data-b="F.amount" value="'+(f.amount===''?'':nf.format(f.amount))+'" autocomplete="off">';
  if(f.type==='bersama'){
    h+='<span class="lbl">Kategori</span><div class="chips">'+CATS.map(function(c){return '<button class="chip" data-act="fcat" data-v="'+esc(c[0])+'" aria-pressed="'+(f.cat===c[0])+'">'+c[1]+' '+c[0]+'</button>'}).join('')+'</div>';
    h+='<span class="lbl">Dibayar pakai</span>'+chipSet('paidBy',[['kas','Kas bersama'],['Devi','Uang Devi'],['Novita','Uang Novita']],f.paidBy);
  }
  if(f.type==='pribadi'){
    h+='<span class="lbl">Milik siapa</span>'+chipSet('owner',PEOPLE_OPTS,f.owner);
    h+='<span class="lbl">Dibayar pakai</span>'+chipSet('ppaid',[['self','Uang sendiri'],['kas','Kas bersama'],['other','Uang '+other(f.owner)]],f.ppaid);
  }
  if(f.type==='iuran'){h+='<span class="lbl">Dari siapa</span>'+chipSet('who',PEOPLE_OPTS,f.who)}
  if(f.type==='pinjam'||f.type==='bayar'){
    h+='<span class="lbl">'+(f.type==='pinjam'?'Dipinjam dari':'Dibayar oleh')+'</span>'+chipSet('from',ALL_OPTS,f.from);
    h+='<span class="lbl">'+(f.type==='pinjam'?'Dipinjam oleh':'Diterima oleh')+'</span>'+chipSet('to',ALL_OPTS,f.to);
  }
  h+='<label class="lbl" for="f-desc">Keterangan</label><input class="inp" id="f-desc" placeholder="'+(f.type==='bersama'?'Misal: bakso sore':f.type==='iuran'?'Iuran bulanan':'Opsional')+'" data-b="F.desc" value="'+esc(f.desc)+'" autocomplete="off">';
  h+='<label class="lbl" for="f-date">Tanggal</label><input class="inp" type="date" id="f-date" data-b="F.date" value="'+esc(f.date)+'">';
  if(f.type==='iuran'){
    var def=f.who==='Devi'?S.settings.iuranDevi:S.settings.iuranNovita;
    h+='<div class="note">Iuran penuh '+f.who+': '+rp(def)+'. <button class="del" style="color:var(--accent-ink);padding:3px 10px" data-act="fillIuran">Isi otomatis</button></div>';
  }
  h+='<div class="btnrow"><button class="btn" data-act="saveadd">Simpan catatan</button></div></div>';
  return h;
}
function strukTotals(){
  var t={bersama:0,Devi:0,Novita:0};
  R.items.forEach(function(i){t[i.who]+=(+i.price||0)});
  var all=t.bersama+t.Devi+t.Novita;
  return '<div class="tot"><span>Bersama</span><span class="num">'+rp(t.bersama)+'</span><span>Punya Devi</span><span class="num">'+rp(t.Devi)+'</span><span>Punya Novita</span><span class="num">'+rp(t.Novita)+'</span><span class="g">Total struk</span><span class="g num">'+rp(all)+'</span></div>';
}
function strukRows(){
  return R.items.map(function(it,i){
    return '<div class="ritem"><div class="rline"><input class="inp" id="r-name-'+i+'" placeholder="Nama barang" data-b="R.items.'+i+'.name" value="'+esc(it.name)+'" aria-label="Nama barang '+(i+1)+'" autocomplete="off">'
     +'<input class="inp num" id="r-price-'+i+'" inputmode="numeric" placeholder="Harga" data-money data-b="R.items.'+i+'.price" value="'+(it.price===''?'':nf.format(it.price))+'" aria-label="Harga barang '+(i+1)+'" autocomplete="off">'
     +'<button class="x" data-act="rdel" data-i="'+i+'" aria-label="Hapus barang '+(i+1)+'">×</button></div>'
     +'<div class="who3">'+['bersama','Devi','Novita'].map(function(w){return '<button class="chip sm" data-w="'+w+'" data-act="ritem" data-i="'+i+'" data-v="'+w+'" aria-pressed="'+(it.who===w)+'">'+(w==='bersama'?'Bersama':w)+'</button>'}).join('')+'</div></div>';
  }).join('');
}
function viewStruk(){

  h+='<div class="card"><div class="row between"><h2>Barang</h2><div class="chips"><button class="chip sm" data-act="rall" data-v="bersama">Semua bersama</button></div></div><div style="margin-top:12px" id="r-rows">'+strukRows()+'</div>';

  h+='<span class="lbl">Dibayar pakai</span>'+chipSet2('paidBy',[['kas','Kas bersama'],['Devi','Uang Devi'],['Novita','Uang Novita']],R.paidBy);

  h+='<div class="btnrow"><button class="btn" data-act="rsave">Simpan struk</button></div></div>';
  return h;

function chipSet2(key,opts,cur){
  return '<div class="chips">'+opts.map(function(o){return '<button class="chip" data-w="'+esc(o[0])+'" data-act="rset" data-k="'+key+'" data-v="'+esc(o[0])+'" aria-pressed="'+(cur===o[0])+'">'+esc(o[1])+'</button>'}).join('')+'</div>';
}
function roundUp(n,s){return Math.ceil(n/s)*s}
function viewRekap(){
  if(!S.loaded)return loadingView();
  var ym=S.month,end=monthEnd(ym),ms=monthStats(S.txs,ym),L=ledger(S.txs,end);
  var h='<h2 style="margin-top:14px">Rekap bulanan</h2>'+monthNav();
  h+='<div class="card"><h2>Ringkasan '+MONTHS[+ym.split('-')[1]-1]+'</h2><div class="tot">'
   +'<span>Iuran masuk</span><span class="num plus">'+rp(ms.masuk.Devi+ms.masuk.Novita)+'</span>'
   +'<span>Belanja bersama</span><span class="num minus">'+rp(ms.bersama)+'</span>'
   +'<span>Belanja pribadi Devi</span><span class="num">'+rp(ms.pribadi.Devi)+'</span>'
   +'<span>Belanja pribadi Novita</span><span class="num">'+rp(ms.pribadi.Novita)+'</span></div>';
  var keys=Object.keys(ms.cats).sort(function(a,b){return ms.cats[b]-ms.cats[a]});
  if(keys.length){
    var max=ms.cats[keys[0]];
    h+='<div style="margin-top:14px" class="cap">Belanja bersama per kategori</div>';
    h+=keys.map(function(k){return '<div class="bar"><span>'+(CATICON[k]||'🐾')+' '+esc(k)+'</span><span class="t"><i style="width:'+Math.max(4,Math.round(ms.cats[k]/max*100))+'%"></i></span><span class="num">'+rp(ms.cats[k])+'</span></div>'}).join('');
  }else if(!ms.n){h+='<div class="note">Belum ada catatan di bulan ini.</div>'}
  h+='</div>';

  var dv=Math.round(L.N.Devi);
  h+='<div class="card"><h2>Hitungan akhir bulan</h2><div class="sub">Sampai '+dateLabel(end)+', sudah termasuk bulan-bulan sebelumnya.</div>';
  if(!L.pairs.length){
    h+='<div class="verdict row">'+cat(52,'happy')+'<div><b>Semua impas</b>Tidak ada yang perlu dibayar.</div></div>';
  }else{
    var head=dv>0?'Novita kasih ke Devi '+rp(dv):dv<0?'Devi kasih ke Novita '+rp(-dv):'Tidak ada uang yang pindah tangan';
    var why=dv===0?'Utang saling menutup. Cukup catat pelunasannya.':'Angka ini sudah menghitung uang kas yang dipegang Novita.';
    h+='<div class="verdict"><b>'+head+'</b>'+why+'</div>';
    h+='<div class="cap" style="margin-top:14px">Rinciannya</div>'+L.pairs.map(function(p){return '<div class="pair"><span>'+esc(pairText(p))+'</span><span class="num">'+rp(p.amount)+'</span></div>'}).join('');
    if(S.confirmSettle){
      h+='<div class="note">Akan dicatat '+L.pairs.length+' pelunasan sesuai rincian di atas.</div><div class="btnrow"><button class="btn half" data-act="settle">Ya, catat lunas</button><button class="btn half ghost" data-act="settlecancel">Batal</button></div>';
    }else{
      h+='<div class="btnrow"><button class="btn" data-act="settle">Tandai semua sudah lunas</button></div>';
    }
  }
  h+='</div>';

  var iD=+S.settings.iuranDevi||0,iN=+S.settings.iuranNovita||0,target=iD+iN,keep=Math.max(0,L.keep);
  h+='<div class="card"><h2>Iuran bulan depan</h2>';
  if(target>0){
    var need=Math.max(0,target-keep),nd=roundUp(need*iD/target,1000),nn=roundUp(need*iN/target,1000);
    if(need<=0){nd=0;nn=0}
    h+='<div class="sub">Sisa kas setelah semua lunas '+rp(L.keep)+', target kas '+rp(target)+'.</div>';
    h+='<div class="tot" style="margin-top:12px"><span><span class="pill" style="background:var(--devi-soft);color:var(--devi-ink)">Devi</span></span><span class="num"><b>'+rp(nd)+'</b></span><span><span class="pill" style="background:var(--novi-soft);color:var(--novi-ink)">Novita</span></span><span class="num"><b>'+rp(nn)+'</b></span></div>';
    h+='<div class="note">'+(need<=0?'Kas masih cukup untuk target bulan depan, jadi iuran boleh diliburkan.':'Dihitung dari iuran penuh masing-masing, dibulatkan ke atas per seribu.')+'</div>';
  }else h+='<div class="sub">Isi iuran penuh di bawah untuk melihat hitungannya.</div>';
  h+='</div>';

  h+='<div class="card"><h2>Iuran penuh per bulan</h2><div class="sub">Dipakai untuk menghitung iuran bulan depan.</div>'
   +'<label class="lbl" for="set-d">Devi</label><input class="inp num" id="set-d" inputmode="numeric" data-money data-set value="'+nf.format(iD)+'">'
   +'<label class="lbl" for="set-n">Novita</label><input class="inp num" id="set-n" inputmode="numeric" data-money data-set value="'+nf.format(iN)+'"></div>';
  h+='<div class="card"><h2>Pakai berdua</h2><div class="sub" style="margin-top:4px">'
   +(S.mode==='local'?'Catatan ini baru tersimpan di HP ini saja. Buka halaman lewat tautan yang dibagikan dengan akun yang sama supaya Devi dan Novita melihat catatan yang sama.'
    :'Supaya Novita bisa ikut mencatat, bagikan halaman ini lewat tombol Bagikan dan beri akses sebagai Contributor. Pilih nama di pojok kanan atas sesuai siapa yang memegang HP.')
   +'</div></div>';
  return h;
}
var VIEWS={home:viewHome,hist:viewHist,add:viewAdd,struk:viewStruk,rekap:viewRekap};
function render(){renderChrome();$('#view').innerHTML=VIEWS[S.tab]()}
function renderData(){renderChrome();if(S.tab==='home'||S.tab==='hist'||S.tab==='rekap')render()}

/* ---------- receipt parsing ---------- */
function parseMoney(str){
  var s=String(str).toLowerCase().replace(/rp\.?/g,'').trim(),mult=1;
  var m=s.match(/^([\d.,]+)\s*(k|rb|ribu)$/);
  if(m){mult=1000;s=m[1]}
  if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,'').replace(',','.');
  else s=s.replace(/[.,]/g,'');
  var v=parseFloat(s);
  return isFinite(v)?Math.round(v*mult):NaN;
}
var SKIP=/(sub\s*total|total|tunai|cash|kembali|change|ppn|pajak|diskon|bayar|debit|kartu|qris|terima kasih|struk|kasir)/i;
function parseReceipt(text){
  var out=[];
  text.split(/\n+/).forEach(function(line){
    line=line.trim();if(!line||SKIP.test(line))return;
    var m=line.match(/^(.*?)[\s:]*((?:rp\.?\s*)?\d[\d.,]*(?:\s*(?:k|rb|ribu))?)\s*$/i);
    if(!m)return;
    var price=parseMoney(m[2]);if(!(price>0))return;
    var name=m[1].replace(/\s+\d+\s*[x×]\s*$/i,'').replace(/[\s.\-:]+$/,'').trim();
    if(!name)return;
    out.push({name:name,price:price,who:'bersama'});
  });
  return out;
}
function addParsed(items){
  if(R.items.length===1&&!R.items[0].name&&R.items[0].price==='')R.items=[];
  R.items=R.items.concat(items);
}
async function readPhoto(file){
  if(!sampleFn||!file)return;
  R.busy=true;R.msg='Meong lagi membaca struk, tunggu sebentar…';render();
  try{
    var data=await sampleFn.json('Ini foto struk belanja dari Indonesia. Balas hanya dengan JSON array berisi objek {"name": string, "price": number} untuk setiap barang yang dibeli. price adalah total harga baris itu dalam rupiah, bilangan bulat tanpa titik. Abaikan subtotal, total, pajak, diskon, tunai, kembalian, dan info toko.',{images:file});
    var items=(Array.isArray(data)?data:[]).map(function(o){return {name:String(o&&o.name||'').trim(),price:Math.round(Number(o&&o.price))||'',who:'bersama'}}).filter(function(o){return o.name||o.price});
    if(items.length){addParsed(items);R.msg='Terbaca '+items.length+' barang. Cek dulu, lalu tandai punya siapa.'}
    else R.msg='Belum ada barang yang terbaca. Coba foto yang lebih dekat dan terang.';
  }catch(e){
    var c=e&&e.code;
    R.msg=c==='rate_limited'?'Terlalu sering membaca foto. Coba lagi nanti.':c==='not_granted'?'Izin membaca foto belum diberikan.':c==='image_rejected'?'Fotonya tidak bisa dipakai. Coba foto lain.':'Foto belum bisa dibaca. Kamu bisa tempel teks struk atau isi manual.';
  }
  R.busy=false;if(S.tab==='struk')render();
}

/* ---------- actions ---------- */
function setPath(path,val){var p=path.split('.');var o=p[0]==='F'?F:R;for(var i=1;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val}
async function saveAdd(){
  if(!guardWrite())return;
  var amt=+F.amount||0;if(amt<=0){toast('Isi nominalnya dulu ya');return}
  var base={type:F.type,amount:amt,date:F.date||todayS(),by:S.me,ts:Date.now()},tx;
  if(F.type==='bersama')tx=Object.assign(base,{desc:F.desc.trim()||F.cat,cat:F.cat,paidBy:F.paidBy});
  else if(F.type==='pribadi'){var paid=F.ppaid==='self'?F.owner:F.ppaid==='other'?other(F.owner):'kas';tx=Object.assign(base,{desc:F.desc.trim()||'Belanja pribadi',who:F.owner,paidBy:paid})}
  else if(F.type==='iuran')tx=Object.assign(base,{desc:F.desc.trim()||'Iuran bulanan',who:F.who});
  else{if(F.from===F.to){toast('Pengirim dan penerima harus beda');return}tx=Object.assign(base,{desc:F.desc.trim()||(F.type==='pinjam'?'Pinjam uang':'Bayar utang'),who:F.from,to:F.to})}
  try{await addTx(tx);var t=F.type;resetF(t);S.tab='add';render();toast('Tersimpan 🐾')}
  catch(e){toast('Belum bisa menyimpan. Coba lagi ya')}
}
async function saveStruk(){
  if(!guardWrite())return;
  var items=R.items.filter(function(i){return (+i.price||0)>0});
  if(!items.length){toast('Isi harga barangnya dulu ya');return}
  var groups={bersama:[],Devi:[],Novita:[]};
  items.forEach(function(i){groups[i.who].push({name:i.name.trim()||'Barang',price:+i.price})});
  var shop=R.store.trim(),n=0,ts=Date.now();
  try{
    for(var w of ['bersama','Devi','Novita']){
      var g=groups[w];if(!g.length)continue;
      var sum=g.reduce(function(a,b){return a+b.price},0);
      var tx={type:w==='bersama'?'bersama':'pribadi',amount:sum,date:R.date||todayS(),by:S.me,ts:ts+n,items:g,paidBy:R.paidBy,
        desc:(shop||'Belanja')+(w==='bersama'?'':' · punya '+w)};
      if(w==='bersama')tx.cat='Belanja';else tx.who=w;
      await addTx(tx);n++;
    }
    resetR();S.tab='struk';render();toast('Struk tersimpan sebagai '+n+' catatan 🐾');
  }catch(e){toast('Belum bisa menyimpan. Coba lagi ya')}
}
async function settle(){
  if(!guardWrite())return;
  if(!S.confirmSettle){S.confirmSettle=true;render();return}
  var end=monthEnd(S.month),today=todayS(),date=end<today?end:today,L=ledger(S.txs,end),ts=Date.now();
  try{
    for(var i=0;i<L.pairs.length;i++){var p=L.pairs[i];
      await addTx({type:'bayar',amount:p.amount,date:date,by:S.me,ts:ts+i,who:p.from,to:p.to,desc:'Pelunasan akhir bulan'});}
    S.confirmSettle=false;render();toast('Semua pelunasan tercatat ✨');
  }catch(e){toast('Belum bisa menyimpan. Coba lagi ya')}
}

document.addEventListener('click',async function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act,v=el.dataset.v;
  if(a==='tab'){S.tab=v;S.open=null;S.confirmDel=null;S.confirmSettle=false;render();window.scrollTo(0,0)}
  else if(a==='me'){S.me=v;lsSet(LS+'.me',v);F.owner=v;F.who=v;F.from=v;F.to=other(v);render()}
  else if(a==='month'){S.month=shiftMonth(S.month,+v);S.open=null;S.confirmSettle=false;render()}
  else if(a==='ftype'){resetF(v);render()}
  else if(a==='fcat'){F.cat=v;render()}
  else if(a==='fset'){
    var k=el.dataset.k;F[k]=v;
    if(k==='from'&&F.to===v)F.to=ALL_OPTS.map(function(o){return o[0]}).find(function(x){return x!==v});
    if(k==='to'&&F.from===v)F.from=ALL_OPTS.map(function(o){return o[0]}).find(function(x){return x!==v});
    render();
  }
  else if(a==='fillIuran'){F.amount=F.who==='Devi'?S.settings.iuranDevi:S.settings.iuranNovita;render()}
  else if(a==='saveadd')saveAdd();
  else if(a==='txopen'){var id=el.dataset.id;S.open=S.open===id?null:id;S.confirmDel=null;render()}
  else if(a==='txdel'){
    if(!guardWrite())return;var id2=el.dataset.id;
    if(S.confirmDel!==id2){S.confirmDel=id2;render();return}
    try{await removeTx(id2);S.confirmDel=null;S.open=null;render();toast('Catatan dihapus')}catch(err){toast('Belum bisa menghapus')}
  }
  else if(a==='rset'){R[el.dataset.k]=v;render()}
  else if(a==='ritem'){R.items[+el.dataset.i].who=v;render()}
  else if(a==='rdel'){R.items.splice(+el.dataset.i,1);if(!R.items.length)R.items=[{name:'',price:'',who:'bersama'}];render()}
  else if(a==='radd'){R.items.push({name:'',price:'',who:'bersama'});render();var ni=document.getElementById('r-name-'+(R.items.length-1));if(ni)ni.focus()}
  else if(a==='rall'){R.items.forEach(function(i){i.who=v});render()}
  else if(a==='rparse'){
    var ta=document.getElementById('r-text');if(ta)R.text=ta.value;
    var found=parseReceipt(R.text);
    if(found.length){addParsed(found);R.text='';R.msg='Terbaca '+found.length+' barang. Cek dulu, lalu tandai punya siapa.'}
    else R.msg='Belum ada baris yang terbaca. Tulis nama barang lalu harga di ujung baris.';
    render();
  }
  else if(a==='rphoto'){var fi=document.getElementById('photo');if(fi)fi.click()}
  else if(a==='rsave')saveStruk();
  else if(a==='settle')settle();
  else if(a==='settlecancel'){S.confirmSettle=false;render()}
});
document.addEventListener('input',function(e){
  var el=e.target;if(!el.matches||!el.matches('[data-b],[data-money]'))return;
  var v=el.value;
  if(el.hasAttribute('data-money')){var dg=v.replace(/\D/g,'');el.value=dg?nf.format(+dg):'';v=dg?+dg:''}
  if(el.dataset.b){
    setPath(el.dataset.b,v);
    if(el.dataset.b.indexOf('R.items')===0){var t=document.getElementById('r-tot');if(t)t.innerHTML=strukTotals()}
  }
});
document.addEventListener('change',async function(e){
  var el=e.target;
  if(el.id==='photo'){var f=el.files&&el.files[0];el.value='';if(f)readPhoto(f);return}
  if(el.matches&&el.matches('[data-set]')){
    if(!guardWrite())return;
    var d=document.getElementById('set-d').value.replace(/\D/g,''),n=document.getElementById('set-n').value.replace(/\D/g,'');
    S.settings.iuranDevi=+d||0;S.settings.iuranNovita=+n||0;
    try{await saveSettings();toast('Iuran penuh tersimpan');render()}catch(err){toast('Belum bisa menyimpan')}
  }
});

/* ---------- boot ---------- */
async function boot(){
  render();
  var C=window.claude,db=null;
  try{if(C&&C.use){
    var u=await C.use('user');
    if(u&&typeof u.can==='function'){var cw=u.can('data.write');if(cw===false)S.canWrite=false}
    db=await C.use('db');
    sampleFn=await C.use('sample');
    if(sampleFn&&sampleFn.limits){var lim=await sampleFn.limits().catch(function(){return null});photoOK=!!(lim&&lim.images)}
  }}catch(e){db=null}
  if(!db){
    store.db=null;loadLocal();sortTx();S.mode='local';S.loaded=true;render();return;
  }
  store.db=db;
  var slow=setTimeout(function(){if(!S.loaded||S.mode!=='live'){S.mode='slow';S.loaded=true;render()}},10000);
  function fail(){clearTimeout(slow);S.mode='slow';S.loaded=true;render()}
  db.collection('tx').onSnapshot(function(snap){
    S.txs=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});sortTx();
    if(!snap.metadata.fromCache){clearTimeout(slow);S.mode='live'}
    S.loaded=true;renderData();
  },fail);
  db.doc('settings/main').onSnapshot(function(s){
    if(s.exists){S.settings=Object.assign(S.settings,s.data());if(S.tab==='rekap')render()}
  },function(){});
}
boot();
})();
</script>
